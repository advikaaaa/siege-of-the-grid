<!DOCTYPE html>
<!--
  index.html - the single page of the game.
  Course concept: none directly; it hosts the canvas that every concept is drawn on.
  Uses: style.css (layout and scaling) and src/main.js (the entry point of the game).

  The script is loaded with type="module" so we can use ES module `import`/`export`.
  Browsers refuse to load modules over file://, so open this page through a local
  static server (for example `python -m http.server`), never by double-clicking it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siege of the Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-container">
    <!-- The real drawing size (1152x768) is set in src/main.js from src/config.js. -->
    <canvas id="game-canvas" width="1152" height="768"></canvas>

    <!-- AI Lab controls. Shown only while the AI Lab scene is active (aiLabScene.js). -->
    <section id="lab-panel" class="panel" hidden>
      <h2>Behavior playground</h2>
      <div class="button-grid">
        <button data-behavior="seek">Seek</button>
        <button data-behavior="flee">Flee</button>
        <button data-behavior="arrive">Arrive</button>
        <button data-behavior="pursue">Pursue</button>
        <button data-behavior="evade">Evade</button>
        <button data-behavior="wander">Wander</button>
      </div>
      <button id="movement-toggle" class="wide">Movement: STEERING (K)</button>

      <label class="slider">
        maxSpeed <span id="value-max-speed"></span>
        <input id="slider-max-speed" type="range" min="10" max="200" step="5">
      </label>
      <label class="slider">
        maxForce <span id="value-max-force"></span>
        <input id="slider-max-force" type="range" min="10" max="800" step="10">
      </label>
      <label class="slider">
        slowing radius <span id="value-slowing-radius"></span>
        <input id="slider-slowing-radius" type="range" min="5" max="200" step="5">
      </label>

      <p id="behavior-explanation"></p>
      <button id="lab-respawn" class="wide">Respawn NPCs</button>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
